# Hand-authored routing taxonomy. Edit this file, then run `npm run build`.
# dist/ROUTER.md is generated from it; never edit the output by hand.
#
# The backbone is chosen by the REPO, not by you:
#   openspec/ present -> OpenSpec flow      otherwise -> Plain (mattpocock) flow
# Both flows share the same primitives: /tdd, /code-review, /grilling, /retro.
intro: >-
  Two workflows cover the idea -> ship backbone. Which one you are in is decided
  by the repo, not by you. OpenSpec repos use the `/opsx:*` flow; every other repo
  uses the mattpocock flow. Both share the same primitives.

start:
  - when: "the working directory contains an `openspec/` directory"
    use: OpenSpec flow
  - when: "otherwise"
    use: Plain flow

flows:
  - id: openspec
    title: "OpenSpec flow - idea to archived change"
    steps:
      - "`/opsx:explore` - optional; use when the idea is still fuzzy"
      - "`/grill-with-docs` - use instead of explore when you want a paper trail (GLOSSARY.md, ADRs)"
      - "`/opsx:propose` - creates proposal, specs, design, tasks in openspec/changes/<name>/"
      - "`/opsx:update` - revise the plan whenever implementation reveals something new"
      - "`/opsx:apply` - work the task list; DRIVE `/tdd` one red-green slice per task"
      - "`/opsx:verify` - check the implementation against the specs"
      - "`/code-review` - when the change becomes a PR, review the diff (Standards + Spec)"
      - "`/opsx:sync` - merge delta specs into openspec/specs/ (archive will also prompt)"
      - "`/opsx:archive` - finalize and move the change into the archive"
      - "`/retro` - close the loop; improve the environment, not the code"
  - id: plain
    title: "Plain flow - idea to shipped PR"
    steps:
      - "`/grill-with-docs` - sharpen the idea; stateful in the repo"
      - "`/to-spec` - turn the thread into a spec"
      - "`/to-tickets` - split into tracer-bullet tickets with blocking edges"
      - "`/implement` - one ticket at a time, driving `/tdd`; `/clear` between tickets"
      - "`/implement-spec` - or build the whole spec in one run (parallel subagents)"
      - "`/code-review` - review the branch or PR (Standards + Spec)"
      - "`/pr` - shape the PR body"
      - "`/retro` - close the loop"

capabilities:
  - title: Sharpen a fuzzy idea
    openspec: "`/opsx:explore`"
    plain: "`/grill-with-docs`"
  - title: "Idea -> plan / spec"
    openspec: "`/opsx:propose`"
    plain: "`/to-spec` + `/to-tickets`"
  - title: Incremental planning
    openspec: "`/opsx:new` + `/opsx:continue`"
    plain: "-"
  - title: Implement
    openspec: "`/opsx:apply`"
    plain: "`/implement` / `/implement-spec`"
  - title: Test-first build
    openspec: "none - drive `/tdd` inside apply"
    plain: "`/tdd`"
  - title: Verify implementation against plan
    openspec: "`/opsx:verify`"
    plain: "`/code-review`"
  - title: Revise the plan
    openspec: "`/opsx:update`"
    plain: "re-run `/grill-with-docs`"
  - title: Finalize and merge specs
    openspec: "`/opsx:sync` + `/opsx:archive`"
    plain: "`/pr` then git merge"

# Everything that is not on a flow. Each line places a skill: the text before
# the first " - " is the skill name, the rest is when to reach for it. The build
# fails loudly (and ROUTER.md grows an "Unplaced" section) if a discovered skill
# is missing from here, so this list cannot silently go stale.
catalog:
  - id: vocabulary
    title: Vocabulary underneath
    description: >-
      References that run beneath the other skills. Reach for one directly when
      the problem is the words rather than the process.
    skills:
      - "codebase-design - design or improve a module's interface: depth, seam, adapter, leverage"
      - "domain-modeling - sharpen domain language, resolve overloaded terms, record ADRs and GLOSSARY.md"
      - "grilling - the interview primitive itself: rounds, frontier, facts are the agent's job, decisions are yours"

  - id: off-flow
    title: Off the main flow
    description: Standalone moves, reached the moment the situation calls for them.
    skills:
      - "diagnosing-bugs - something is broken and resists a first glance: get a tight red feedback loop first, then fix with a regression test"
      - "prototype - a design question needs a runnable answer: throwaway code, kept as a primary source"
      - "research - you need the right API or fact; delegates to a background agent reading primary sources"
      - "to-questionnaire - the blocker is in someone else's head; writes them a questionnaire to fill in"
      - "wizard - steps only a human can take: secrets, third-party dashboards, one-off cutovers"
      - "wait-what - a message did not land; re-pitches it in plain English using the GLOSSARY vocabulary"
      - "teach - learn a concept over multiple sessions, using the directory as a stateful workspace"
      - "grill-me - the stateless interview, for when you are NOT in a working directory; `/grill-with-docs` is strictly better when a repo is there"
      - "write-a-prd - draft a product requirements document through user interview and codebase exploration"

  - id: onramps
    title: On-ramps and upkeep
    description: Situations that generate work, or keep the codebase good for agents.
    skills:
      - "triage - bugs and requests you did not create are piling up; moves them to agent-ready issues. Never triage tickets from `/to-tickets`"
      - "wayfinder - a huge, foggy effort too big for one session; produces decisions, not deliverables"
      - "improve-codebase-architecture - a spare moment to survey the codebase for deepening opportunities"
      - "resolving-merge-conflicts - you are mid-merge and the conflicts need resolving"

  - id: context
    title: Context and handoff
    description: >-
      Deciding what happens to the current context window at a phase boundary.
    skills:
      - "handoff - port work to a new harness, directory, or colleague; writes a portable markdown file"
      - "loop-me - grill you about specs for the workflows you want to build, in this workspace"

  - id: writing
    title: Writing
    description: >-
      Writing documents, for people or for agents.
    skills:
      - "writing-for-agents - the reference for writing documents agents consume: skills, AGENTS.md, pointed-at docs"
      - "writing-great-skills - the vocabulary and principles for writing predictable, effective skills"
      - "writing-fragments - explore: mine raw fragments with no structure yet"
      - "writing-beats - exploit: assemble raw material into a journey of beats"
      - "writing-shape - exploit: shape raw material into an article, paragraph by paragraph"

  - id: setup
    title: One-time setup
    description: Configuration that has to happen before a flow can run.
    skills:
      - "setup-matt-pocock-skills - run once before the first engineering flow: issue tracker, triage labels, doc layout"
      - "setup-pre-commit - Husky, lint-staged, typecheck, and tests at commit time"
      - "setup-ts-deep-modules - wire dependency-cruiser so each package is a deep module behind entry points"

  - id: cloudflare
    title: Cloudflare platform
    description: >-
      Reach on their own triggers; none of them sit on the idea-to-ship backbone.
    skills:
      - "cloudflare - any Cloudflare development task: Workers, Pages, KV, D1, R2, AI, networking, IaC"
      - "workers-best-practices - author or review Workers code against production practice"
      - "wrangler - run any wrangler command: dev, deploy, D1, KV, R2, Queues, Containers, Secrets"
      - "durable-objects - build or review stateful coordination, RPC, SQLite storage, alarms, WebSockets"
      - "agents-sdk - build agents on Workers: state, callable RPC, Workflows, MCP servers, queues, hooks"
      - "sandbox-sdk - sandboxed execution for AI code execution, code interpreters, CI, untrusted code"
      - "cloudflare-one - Zero Trust and SASE: Access, Gateway, WARP, Tunnel, DLP, CASB, posture, identity"
      - "cloudflare-one-migrations - plan a move from Zscaler, Palo Alto, legacy VPN, or SWG to Cloudflare One"
      - "cloudflare-email-service - send and receive transactional email; SPF/DKIM/DMARC, wrangler email setup"
      - "turnstile-spin - set up Turnstile end to end: widget, siteverify Worker, frontend, validation"
      - "web-perf - audit page performance, Core Web Vitals, render-blocking resources, layout shifts"

  - id: tooling
    title: Tooling and integrations
    skills:
      - "linear-planning - Linear issues, tickets, labels, projects, backlog, and planning"
      - "playwright-cli - drive a real browser: automate interactions, test pages, run Playwright tests"
      - "typesafe-ai - TypeSafe: small units of AI intelligence used as programming primitives"

  - id: meta
    title: This routing system
    description: >-
      The skills that decide and maintain everything above. You should not need
      these once the router is working.
    skills:
      - "next-skill - this router: reads the generated tree and picks the flow and leaf for the situation"
      - "ask-matt - Matt Pocock's own hand-written router over his skill set; useful reference, superseded by this one"
      - "find-skills - discover and install new skills from the ecosystem via `npx skills find`"
